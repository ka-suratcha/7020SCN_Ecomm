# CI for Ecomm: one job for each CI control in Table 5.
name: Django CI

# Run on a push to any branch, and on a pull request to main.
on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  # Gate: the build fails if Ruff reports any finding.
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - run: pip install -r requirements-dev.txt
    - run: ruff check . --select E,F,W,B --extend-exclude migrations

  # Gate: the build fails on a Medium or High Bandit finding (-ll).
  security:
    name: Security (Bandit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - run: pip install -r requirements-dev.txt
    - run: bandit -r ecomm home orders products seller_dashboard shops users manage.py -x "*/migrations/*" -ll

  # Gate: every test must pass (TC-1 to TC-4, and TC-5 regression),
  # and coverage of orders and products must not fall below 75% (ratchet).
  tests:
    name: Tests and coverage (pytest)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - run: pip install -r requirements-dev.txt
    - run: pytest -v --cov=orders --cov=products --cov-report=term-missing --cov-fail-under=75

  # Report only: complexity of the project code (no gate).
  complexity:
    name: Complexity report (Radon)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - run: pip install -r requirements-dev.txt
    - run: radon cc . -a -s -i migrations,tests